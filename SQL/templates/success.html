{% extends "base.html" %}
{% block title %}GMIT - Lab Solved{% endblock %}

{% block content %}
<div class="lab-card success-card">
  <div class="solved-icon">✓</div>
  <h1>Lab Solved!</h1>
  <p>You successfully bypassed the login using SQL injection.</p>
  <p class="logged-user">Authenticated as: <strong>{{ username }}</strong></p>

  <div class="flag-box">{{ flag }}</div>

  <div class="actions">
    <a class="btn secondary" href="{{ url_for('logout') }}">Try Again</a>
    <a class="btn" href="{{ url_for('reset') }}">Reset Lab</a>
  </div>
</div>
{% endblock %}
